<body>
  <div id="__bundler_placeholder">Loading Energy Stores and Transfers...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F3F5F7}\na{color:#1D4ED8}a:hover{color:#1E3A8A}\ninput[type=range]{width:100%;accent-color:#1D4ED8;height:28px}\nbutton{font-family:inherit;cursor:pointer}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'Lexend', system-ui, sans-serif; color: #12212E; background: #F3F5F7; min-height: 100vh\" data-canvas-width=\"1280\" data-canvas-height=\"7600\" data-document-role=\"page\" data-label=\"Energy Stores and Transfers — Interactive Lesson\">\n\n<header style=\"background: #12212E; color: #F3F5F7; padding: 40px 24px 32px\">\n<div style=\"max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #9FB4C8\">Cambridge IGCSE Physics 0625 · Topic 1.7 Energy, work and power · Chapter 6<\u002Fp>\n<h1 style=\"margin: 0; font-size: 44px; line-height: 1.1; font-weight: 700\">Energy Stores and Transfers<\u002Fh1>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #D5DEE7; max-width: 760px\">Learn where energy is stored, how it moves between stores, why the total never changes, and how to calculate kinetic and gravitational potential energy.<\u002Fp>\n<nav aria-label=\"Lesson sections\" style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px\">\n<a href=\"#stores\" style=\"color: #12212E; background: #F3F5F7; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 500\">6.1 Energy stores<\u002Fa>\n<a href=\"#transfers\" style=\"color: #12212E; background: #F3F5F7; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 500\">6.2 Energy transfers<\u002Fa>\n<a href=\"#conservation\" style=\"color: #12212E; background: #F3F5F7; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 500\">6.3 Conservation of energy<\u002Fa>\n<a href=\"#calculations\" style=\"color: #12212E; background: #F3F5F7; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 500\">6.4 Energy calculations<\u002Fa>\n<a href=\"#exercises\" style=\"color: #12212E; background: #F2C14E; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 600\">Exercises<\u002Fa>\n<a href=\"#summary\" style=\"color: #12212E; background: #F3F5F7; text-decoration: none; padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 500\">Summary<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 48px\">\n\n<section aria-labelledby=\"obj-h\" style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 16px; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"obj-h\" style=\"margin: 0; font-size: 22px\">Learning objectives<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; color: #46586A\">By the end of this lesson you should be able to:<\u002Fp>\n<ul style=\"margin: 0; padding-left: 22px; font-size: 16px; line-height: 1.8\">\n<li>state that energy may be stored as kinetic, gravitational potential, chemical, elastic (strain), nuclear, electrostatic and internal (thermal) energy;<\u002Fli>\n<li>describe how energy is transferred: mechanically (work done by forces), electrically (work done by a current), by heating, and by waves (electromagnetic, sound and other waves);<\u002Fli>\n<li>know the principle of the conservation of energy and use it to describe energy changes, including with Sankey diagrams;<\u002Fli>\n<li>recall and use E<sub>k<\u002Fsub> = ½mv² and ΔE<sub>p<\u002Fsub> = mgΔh.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section id=\"stores\" aria-labelledby=\"stores-h\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #1D4ED8; font-weight: 700\">6.1<\u002Fp>\n<h2 id=\"stores-h\" style=\"margin: 0; font-size: 32px\">Energy stores<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; max-width: 820px\">Energy is a quantity that is measured in <strong>joules (J)<\u002Fstrong>. We describe energy as being held in different <strong>stores<\u002Fstrong>. When something happens, energy moves from one store to another. The Cambridge syllabus uses seven stores:<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px\">\n<sc-for list=\"{{stores}}\" as=\"st\" hint-placeholder-count=\"7\">\n<article style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 4px; background: {{st.color}}\"><\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px\">{{st.name}}<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">{{st.desc}}<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #46586A\"><strong style=\"color: #12212E\">Example:<\u002Fstrong> {{st.ex}}<\u002Fp>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<aside style=\"background: #E9F0FF; border-radius: 12px; padding: 16px 20px; font-size: 15px; line-height: 1.6\">\n<strong>Tip:<\u002Fstrong> “Heat” is not a store. When a hot object cools, energy is transferred <em>by heating<\u002Fem> from its <strong>internal (thermal) store<\u002Fstrong> to the internal store of the surroundings.\n<\u002Faside>\n<\u002Fsection>\n\n<section id=\"transfers\" aria-labelledby=\"transfers-h\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #1D4ED8; font-weight: 700\">6.2<\u002Fp>\n<h2 id=\"transfers-h\" style=\"margin: 0; font-size: 32px\">Energy transfers<\u002Fh2>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; max-width: 820px\">Energy is moved between stores by four kinds of <strong>transfer pathway<\u002Fstrong>:<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 18px\">Mechanically<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">A force does work by moving an object, e.g. pushing a trolley, gravity pulling a falling ball.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 18px\">Electrically<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">An electric current does work, e.g. a battery driving a current through a motor.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 18px\">By heating<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">Energy flows from a hotter object to a cooler one because of a temperature difference.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 18px\">By waves<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">Electromagnetic waves (light, infrared), sound waves and other waves carry energy from place to place.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 22px\">Interactive: Energy transfer explorer<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #46586A\">Choose a situation to see the energy stores (blue) and the transfer pathways (amber) involved.<\u002Fp>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Choose a situation\" style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{chains}}\" as=\"c\" hint-placeholder-count=\"6\">\n<button type=\"button\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.pressed}}\" style=\"min-height: 44px; padding: 10px 16px; border-radius: 10px; font-size: 15px; font-weight: 500; {{c.btnStyle}}\">{{c.name}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<sc-for list=\"{{chainSteps}}\" as=\"s\" hint-placeholder-count=\"5\">\n<sc-if value=\"{{s.arrow}}\" hint-placeholder-val=\"{{ true }}\">\n<span aria-hidden=\"true\" style=\"font-size: 22px; color: #6B7C8D\">→<\u002Fspan>\n<\u002Fsc-if>\n<div style=\"padding: 12px 14px; border-radius: 10px; max-width: 240px; display: flex; flex-direction: column; gap: 4px; {{s.style}}\">\n<span style=\"font-size: 11px; letter-spacing: 0.08em; font-weight: 700\">{{s.tag}}<\u002Fspan>\n<span style=\"font-size: 15px; line-height: 1.4\">{{s.text}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; background: #F3F5F7; border-radius: 10px; padding: 12px 16px\">{{chainNote}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"conservation\" aria-labelledby=\"cons-h\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #1D4ED8; font-weight: 700\">6.3<\u002Fp>\n<h2 id=\"cons-h\" style=\"margin: 0; font-size: 32px\">Conservation of energy<\u002Fh2>\n<div style=\"background: #12212E; color: #F3F5F7; border-radius: 14px; padding: 20px 24px; font-size: 19px; line-height: 1.6; max-width: 860px\">\n<strong>Principle of conservation of energy:<\u002Fstrong> energy cannot be created or destroyed. It can only be transferred from one store to another. The total energy of a closed system stays the same.\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.7; max-width: 820px\">In real devices, some energy is always transferred to stores we do not want — usually the internal (thermal) store of the surroundings. This energy is <strong>wasted<\u002Fstrong> (dissipated), but it is <em>not<\u002Fem> destroyed.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 22px\">Simulation 1: Swinging pendulum<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #46586A\">Pendulum length 2.0 m, g = 9.8 N/kg. Watch energy move between the gravitational potential and kinetic stores. Switch on air resistance to see energy dissipated to the internal store.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<svg sc-camel-view-box=\"0 0 420 280\" role=\"img\" aria-label=\"Pendulum animation\" style=\"width: 100%; height: auto; background: #F7F9FB; border-radius: 12px\">\n<line x1=\"150\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#12212E\" stroke-width=\"4\"><\u002Fline>\n<polyline points=\"{{arcPts}}\" fill=\"none\" stroke=\"#9AA9B8\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"><\u002Fpolyline>\n<line x1=\"60\" y1=\"240\" x2=\"360\" y2=\"240\" stroke=\"#9AA9B8\" stroke-width=\"1\" stroke-dasharray=\"6 4\"><\u002Fline>\n<text x=\"62\" y=\"256\" font-size=\"12\" fill=\"#46586A\">lowest point (h = 0)<\u002Ftext>\n<line x1=\"{{bobX}}\" y1=\"{{bobY}}\" x2=\"380\" y2=\"{{bobY}}\" stroke=\"#1D4ED8\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fline>\n<line x1=\"385\" y1=\"240\" x2=\"385\" y2=\"{{bobY}}\" stroke=\"#1D4ED8\" stroke-width=\"2\"><\u002Fline>\n<line x1=\"210\" y1=\"20\" x2=\"{{bobX}}\" y2=\"{{bobY}}\" stroke=\"#12212E\" stroke-width=\"2\"><\u002Fline>\n<circle cx=\"210\" cy=\"20\" r=\"4\" fill=\"#12212E\"><\u002Fcircle>\n<circle cx=\"{{bobX}}\" cy=\"{{bobY}}\" r=\"16\" fill=\"#E8A317\" stroke=\"#12212E\" stroke-width=\"2\"><\u002Fcircle>\n<\u002Fsvg>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{toggleRun}}\" style=\"min-height: 44px; padding: 10px 18px; border-radius: 10px; border: none; background: #1D4ED8; color: #FFFFFF; font-size: 15px; font-weight: 600\">{{runLabel}}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{resetPend}}\" style=\"min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1.5px solid #12212E; background: #FFFFFF; color: #12212E; font-size: 15px; font-weight: 500\">Restart<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{toggleAir}}\" aria-pressed=\"{{airPressed}}\" style=\"min-height: 44px; padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; {{airStyle}}\">{{airLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"pm\" style=\"font-size: 14px; font-weight: 500\">Mass: {{massTxt}} kg<\u002Flabel>\n<input id=\"pm\" type=\"range\" min=\"0.5\" max=\"5\" step=\"0.5\" value=\"{{mass}}\" sc-camel-on-change=\"{{onMass}}\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"pa\" style=\"font-size: 14px; font-weight: 500\">Release angle: {{angle}}°<\u002Flabel>\n<input id=\"pa\" type=\"range\" min=\"10\" max=\"60\" step=\"5\" value=\"{{angle}}\" sc-camel-on-change=\"{{onAngle}}\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: flex-end; justify-content: space-around; height: 200px; border-bottom: 2px solid #12212E; padding: 0 8px\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">{{peTxt}}<\u002Fspan><div style=\"width: 52px; height: {{peH}}px; background: #1D4ED8; border-radius: 6px 6px 0 0\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">{{keTxt}}<\u002Fspan><div style=\"width: 52px; height: {{keH}}px; background: #E8A317; border-radius: 6px 6px 0 0\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">{{thTxt}}<\u002Fspan><div style=\"width: 52px; height: {{thH}}px; background: #B4413A; border-radius: 6px 6px 0 0\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">{{totTxt}}<\u002Fspan><div style=\"width: 52px; height: 170px; background: #9AA9B8; border-radius: 6px 6px 0 0\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-around; font-size: 13px; text-align: center; gap: 6px\">\n<span style=\"width: 70px\">GPE store<\u002Fspan><span style=\"width: 70px\">Kinetic store<\u002Fspan><span style=\"width: 70px\">Internal (thermal)<\u002Fspan><span style=\"width: 70px\">Total<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 14px\">\n<div style=\"background: #F3F5F7; border-radius: 10px; padding: 10px 12px\">Height above lowest point<br><strong style=\"font-family: 'JetBrains Mono', monospace; font-size: 16px\">{{hTxt}} m<\u002Fstrong><\u002Fdiv>\n<div style=\"background: #F3F5F7; border-radius: 10px; padding: 10px 12px\">Speed of bob<br><strong style=\"font-family: 'JetBrains Mono', monospace; font-size: 16px\">{{vTxt}} m/s<\u002Fstrong><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #2E3F50\">Notice: GPE + KE + internal energy always equals the starting energy {{totTxt}}. Energy is transferred, never lost.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h3 style=\"margin: 0; font-size: 22px\">Simulation 2: Sankey diagram builder<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; color: #46586A\">A Sankey diagram shows energy transfers. The width of each arrow is proportional to the amount of energy. Input = useful output + wasted output.<\u002Fp>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Choose a device\" style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{devices}}\" as=\"d\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{d.pick}}\" aria-pressed=\"{{d.pressed}}\" style=\"min-height: 44px; padding: 10px 16px; border-radius: 10px; font-size: 15px; font-weight: 500; {{d.btnStyle}}\">{{d.name}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: center\">\n<svg sc-camel-view-box=\"0 0 440 270\" role=\"img\" aria-label=\"Sankey diagram of the chosen device\" style=\"width: 100%; height: auto; background: #F7F9FB; border-radius: 12px\">\n<polygon points=\"20,30 200,30 200,150 20,150\" fill=\"#475569\"><\u002Fpolygon>\n<polygon points=\"{{usePts}}\" fill=\"#1D4ED8\"><\u002Fpolygon>\n<polygon points=\"{{wastePts}}\" fill=\"#E8A317\"><\u002Fpolygon>\n<text x=\"30\" y=\"96\" font-size=\"15\" fill=\"#FFFFFF\" font-weight=\"600\">100 J in<\u002Ftext>\n<\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"eff\" style=\"font-size: 14px; font-weight: 500\">Efficiency: {{eff}} %<\u002Flabel>\n<input id=\"eff\" type=\"range\" min=\"5\" max=\"95\" step=\"1\" value=\"{{eff}}\" sc-camel-on-change=\"{{onEff}}\">\n<\u002Fdiv>\n<div style=\"display: flex; align-items: flex-start; gap: 10px; font-size: 15px\"><span aria-hidden=\"true\" style=\"flex: none; width: 14px; height: 14px; margin-top: 4px; border-radius: 3px; background: #475569\"><\u002Fspan><span><strong>Input (100 J):<\u002Fstrong> {{devIn}}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: flex-start; gap: 10px; font-size: 15px\"><span aria-hidden=\"true\" style=\"flex: none; width: 14px; height: 14px; margin-top: 4px; border-radius: 3px; background: #1D4ED8\"><\u002Fspan><span><strong>Useful ({{eff}} J):<\u002Fstrong> {{devUse}}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: flex-start; gap: 10px; font-size: 15px\"><span aria-hidden=\"true\" style=\"flex: none; width: 14px; height: 14px; margin-top: 4px; border-radius: 3px; background: #E8A317\"><\u002Fspan><span><strong>Wasted ({{wasted}} J):<\u002Fstrong> {{devWaste}}<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6; background: #F3F5F7; border-radius: 10px; padding: 10px 14px\">Extension (syllabus 1.7.4): efficiency = (useful energy output ÷ total energy input) × 100% = ({{eff}} J ÷ 100 J) × 100% = <strong>{{eff}} %<\u002Fstrong>. Preset values are typical approximations.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"calculations\" aria-labelledby=\"calc-h\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #1D4ED8; font-weight: 700\">6.4<\u002Fp>\n<h2 id=\"calc-h\" style=\"margin: 0; font-size: 32px\">Energy calculations<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 18px\">Kinetic energy<\u002Fh3>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #B26B00\">E<sub>k<\u002Fsub> = ½ m v²<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">E<sub>k<\u002Fsub> = kinetic energy (J), m = mass (kg), v = speed (m/s). Doubling the speed makes the kinetic energy <strong>four times<\u002Fstrong> larger.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 18px\">Change in gravitational potential energy<\u002Fh3>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #1D4ED8\">ΔE<sub>p<\u002Fsub> = m g Δh<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #2E3F50\">ΔE<sub>p<\u002Fsub> = change in GPE (J), m = mass (kg), g = gravitational field strength (9.8 N/kg on Earth), Δh = change in height (m).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<h3 style=\"margin: 0; font-size: 22px\">Simulation 3: Energy calculators<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px; background: #FFF8EA; border-radius: 12px; padding: 18px\">\n<h4 style=\"margin: 0; font-size: 17px\">Kinetic energy calculator<\u002Fh4>\n<label for=\"km\" style=\"font-size: 14px; font-weight: 500\">Mass m = {{keM}} kg<\u002Flabel>\n<input id=\"km\" type=\"range\" min=\"1\" max=\"100\" step=\"1\" value=\"{{keM}}\" sc-camel-on-change=\"{{onKeM}}\">\n<label for=\"kv\" style=\"font-size: 14px; font-weight: 500\">Speed v = {{keV}} m/s<\u002Flabel>\n<input id=\"kv\" type=\"range\" min=\"0\" max=\"40\" step=\"0.5\" value=\"{{keV}}\" sc-camel-on-change=\"{{onKeV}}\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.9; background: #FFFFFF; border-radius: 10px; padding: 12px 14px\">\nE<sub>k<\u002Fsub> = ½ × m × v²<br>E<sub>k<\u002Fsub> = ½ × {{keM}} × ({{keV}})²<br><strong style=\"font-size: 18px\">E<sub>k<\u002Fsub> = {{keRes}} J<\u002Fstrong>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; background: #EEF3FF; border-radius: 12px; padding: 18px\">\n<h4 style=\"margin: 0; font-size: 17px\">GPE calculator and drop test<\u002Fh4>\n<label for=\"gm\" style=\"font-size: 14px; font-weight: 500\">Mass m = {{gpM}} kg<\u002Flabel>\n<input id=\"gm\" type=\"range\" min=\"1\" max=\"100\" step=\"1\" value=\"{{gpM}}\" sc-camel-on-change=\"{{onGpM}}\">\n<label for=\"gh\" style=\"font-size: 14px; font-weight: 500\">Height change Δh = {{gpH}} m<\u002Flabel>\n<input id=\"gh\" type=\"range\" min=\"0\" max=\"50\" step=\"0.5\" value=\"{{gpH}}\" sc-camel-on-change=\"{{onGpH}}\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.9; background: #FFFFFF; border-radius: 10px; padding: 12px 14px\">\nΔE<sub>p<\u002Fsub> = m × g × Δh<br>ΔE<sub>p<\u002Fsub> = {{gpM}} × 9.8 × {{gpH}}<br><strong style=\"font-size: 18px\">ΔE<sub>p<\u002Fsub> = {{gpRes}} J<\u002Fstrong>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6\">If the object is dropped (no air resistance), all of this GPE becomes KE: ½mv² = mgΔh, so v = √(2gΔh) = <strong>{{dropV}} m/s<\u002Fstrong> just before it lands. The mass cancels!<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 18px\">Worked example 1<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6\">A cyclist and bicycle have a total mass of 80 kg and travel at 6.0 m/s. Calculate their kinetic energy.<\u002Fp>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.9; background: #F3F5F7; border-radius: 10px; padding: 12px 14px\">E<sub>k<\u002Fsub> = ½mv²<br>= ½ × 80 × 6.0²<br>= ½ × 80 × 36<br>= <strong>1440 J<\u002Fstrong><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 18px\">Worked example 2<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6\">A 1.5 kg book is lifted from the floor onto a shelf 2.0 m high. Calculate the gain in GPE. (g = 9.8 N/kg)<\u002Fp>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.9; background: #F3F5F7; border-radius: 10px; padding: 12px 14px\">ΔE<sub>p<\u002Fsub> = mgΔh<br>= 1.5 × 9.8 × 2.0<br>= <strong>29.4 J<\u002Fstrong> (≈ 29 J)<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: 18px\">Worked example 3<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6\">A stone falls 5.0 m from rest. Ignoring air resistance, find its speed just before it hits the ground.<\u002Fp>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.9; background: #F3F5F7; border-radius: 10px; padding: 12px 14px\">GPE lost = KE gained<br>mgΔh = ½mv²<br>v = √(2gΔh) = √(2 × 9.8 × 5.0)<br>= √98 = <strong>9.9 m/s<\u002Fstrong><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"exercises\" aria-labelledby=\"ex-h\" style=\"display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #1D4ED8; font-weight: 700\">PRACTICE<\u002Fp>\n<h2 id=\"ex-h\" style=\"margin: 0; font-size: 32px\">Exercises<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; color: #46586A\">Part A: multiple choice (instant feedback). Use g = 9.8 N/kg.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<p style=\"margin: 0; font-size: 17px; font-weight: 600\">Score: {{score}} / {{qTotal}}<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{resetQuiz}}\" style=\"min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1.5px solid #12212E; background: #FFFFFF; color: #12212E; font-size: 15px; font-weight: 500\">Reset quiz<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{questions}}\" as=\"q\" hint-placeholder-count=\"10\">\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6\"><strong>{{q.num}}.<\u002Fstrong> {{q.text}}<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px\">\n<sc-for list=\"{{q.opts}}\" as=\"o\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{o.pick}}\" style=\"min-height: 44px; text-align: left; padding: 10px 14px; border-radius: 10px; font-size: 15px; {{o.style}}\"><strong>{{o.letter}}<\u002Fstrong>  {{o.text}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{q.answered}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-size: 15px; line-height: 1.6; background: #F3F5F7; border-radius: 10px; padding: 10px 14px\"><strong>{{q.verdict}}<\u002Fstrong> {{q.explain}}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 12px\">\n<h3 style=\"margin: 0; font-size: 24px\">Part B: Structured questions<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; color: #46586A\">Write your full working first, then reveal the model answer to check.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<sc-for list=\"{{structured}}\" as=\"sq\" hint-placeholder-count=\"5\">\n<div style=\"background: #FFFFFF; border: 1px solid #D8DEE5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; white-space: pre-line\"><strong>{{sq.num}}.<\u002Fstrong> {{sq.q}}<\u002Fp>\n<div>\n<button type=\"button\" sc-camel-on-click=\"{{sq.toggle}}\" aria-expanded=\"{{sq.open}}\" style=\"min-height: 44px; padding: 10px 18px; border-radius: 10px; border: none; background: #1D4ED8; color: #FFFFFF; font-size: 15px; font-weight: 600\">{{sq.btn}}<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{sq.open}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size: 15px; line-height: 1.8; background: #E7F6EC; border-radius: 10px; padding: 12px 16px; white-space: pre-line; font-family: 'JetBrains Mono', monospace\">{{sq.a}}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"summary\" aria-labelledby=\"sum-h\" style=\"background: #12212E; color: #F3F5F7; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<h2 id=\"sum-h\" style=\"margin: 0; font-size: 30px\">Summary<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 22px; font-size: 16px; line-height: 1.9; color: #E2E9F0\">\n<li>Energy is measured in joules (J) and is described as being held in <strong>stores<\u002Fstrong>: kinetic, gravitational potential, chemical, elastic (strain), nuclear, electrostatic and internal (thermal).<\u002Fli>\n<li>Energy is transferred between stores <strong>mechanically<\u002Fstrong>, <strong>electrically<\u002Fstrong>, <strong>by heating<\u002Fstrong> and <strong>by waves<\u002Fstrong> (electromagnetic, sound and other waves).<\u002Fli>\n<li>Energy cannot be created or destroyed; the total energy of a closed system is constant (<strong>conservation of energy<\u002Fstrong>).<\u002Fli>\n<li>Wasted energy is usually dissipated to the internal store of the surroundings. Sankey diagrams show transfers with arrow widths proportional to energy.<\u002Fli>\n<li>Kinetic energy: <strong>E<sub>k<\u002Fsub> = ½mv²<\u002Fstrong>. Change in GPE: <strong>ΔE<sub>p<\u002Fsub> = mgΔh<\u002Fstrong>.<\u002Fli>\n<li>For a falling object with no air resistance, GPE lost = KE gained, so v = √(2gΔh).<\u002Fli>\n<\u002Ful>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px\">\n<div style=\"background: #1E3247; border-radius: 12px; padding: 14px 16px\"><p style=\"margin: 0; font-size: 13px; color: #9FB4C8\">Kinetic energy<\u002Fp><p style=\"margin: 4px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700\">E<sub>k<\u002Fsub> = ½mv²<\u002Fp><\u002Fdiv>\n<div style=\"background: #1E3247; border-radius: 12px; padding: 14px 16px\"><p style=\"margin: 0; font-size: 13px; color: #9FB4C8\">Gravitational PE<\u002Fp><p style=\"margin: 4px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700\">ΔE<sub>p<\u002Fsub> = mgΔh<\u002Fp><\u002Fdiv>\n<div style=\"background: #1E3247; border-radius: 12px; padding: 14px 16px\"><p style=\"margin: 0; font-size: 13px; color: #9FB4C8\">Efficiency (extension)<\u002Fp><p style=\"margin: 4px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700\">useful out ÷ total in × 100%<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7600}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { t: 0, running: true, mass: 2, angle: 40, air: false, device: 'filament', eff: 10, chain: 'torch', keM: 2, keV: 5, gpM: 2, gpH: 10, answers: {}, shown: {} };\n  }\n  componentDidMount() {\n    this.timer = setInterval(() => {\n      if (this.state.running) this.setState({ t: this.state.t + 0.04 });\n    }, 40);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  renderVals() {\n    const s = this.state;\n    const fmt = (x, d) => Number(x).toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: d });\n    const BLUE = 'background:#EEF3FF;border:1.5px solid #1D4ED8;color:#12212E';\n    const AMBER = 'background:#FFF6E5;border:1.5px dashed #B26B00;color:#12212E';\n    const BTN_ON = 'border:1.5px solid #12212E;background:#12212E;color:#FFFFFF';\n    const BTN_OFF = 'border:1.5px solid #9AA9B8;background:#FFFFFF;color:#12212E';\n\n    const stores = [\n      { name: 'Kinetic', color: '#E8A317', desc: 'Energy of a moving object. Greater mass or speed means more kinetic energy.', ex: 'A moving car, a flying football.' },\n      { name: 'Gravitational potential', color: '#1D4ED8', desc: 'Energy of an object due to its height in a gravitational field.', ex: 'Water held behind a dam, a book on a high shelf.' },\n      { name: 'Chemical', color: '#15803D', desc: 'Energy stored in chemical bonds, released in chemical reactions.', ex: 'Food, fuels, batteries.' },\n      { name: 'Elastic (strain)', color: '#7C3AED', desc: 'Energy stored in an object that is stretched, squashed or bent.', ex: 'A stretched spring, a drawn bow, a squashed ball.' },\n      { name: 'Nuclear', color: '#475569', desc: 'Energy stored in the nuclei of atoms, released by fission or fusion.', ex: 'Uranium fuel, nuclear fusion in the Sun.' },\n      { name: 'Electrostatic', color: '#0E7490', desc: 'Energy stored between charges that attract or repel each other.', ex: 'A charged balloon, a thundercloud.' },\n      { name: 'Internal (thermal)', color: '#B4413A', desc: 'Total kinetic and potential energy of the particles in an object; increases as it gets hotter.', ex: 'Hot water in a kettle, a warm room.' }\n    ];\n\n    const chainData = {\n      torch: { name: 'Torch', steps: [['STORE', 'Chemical store of battery', 'b'], ['PATHWAY', 'Electrically (current in circuit)', 'a'], ['PATHWAY', 'By light waves and by heating', 'a'], ['STORE', 'Internal (thermal) store of surroundings', 'b']], note: 'Useful output: light. Wasted: heating of the lamp and surroundings. Eventually all the energy ends up in the internal store of the surroundings.' },\n      kettle: { name: 'Electric kettle', steps: [['PATHWAY', 'Electrically (mains current)', 'a'], ['STORE', 'Internal store of heating element', 'b'], ['PATHWAY', 'By heating', 'a'], ['STORE', 'Internal (thermal) store of water', 'b']], note: 'Useful output: the water gets hotter. Some energy is wasted heating the kettle body and surrounding air, and as sound.' },\n      brake: { name: 'Car braking', steps: [['STORE', 'Kinetic store of car', 'b'], ['PATHWAY', 'Mechanically (friction force at brakes)', 'a'], ['STORE', 'Internal (thermal) store of brakes', 'b'], ['PATHWAY', 'By heating', 'a'], ['STORE', 'Internal store of surroundings', 'b']], note: 'The car slows down because friction does work on it. The brakes get hot, then cool by heating the air.' },\n      bow: { name: 'Bow and arrow (shot upwards)', steps: [['STORE', 'Elastic store of drawn bow', 'b'], ['PATHWAY', 'Mechanically (force of string on arrow)', 'a'], ['STORE', 'Kinetic store of arrow', 'b'], ['PATHWAY', 'Mechanically (work done against gravity)', 'a'], ['STORE', 'Gravitational potential store of arrow', 'b']], note: 'At the highest point the arrow momentarily stops: its kinetic store is (nearly) empty and its GPE store is greatest.' },\n      apple: { name: 'Falling apple', steps: [['STORE', 'Gravitational potential store of apple', 'b'], ['PATHWAY', 'Mechanically (weight does work)', 'a'], ['STORE', 'Kinetic store of apple', 'b'], ['PATHWAY', 'On impact: by sound waves and heating', 'a'], ['STORE', 'Internal store of apple and ground', 'b']], note: 'As the apple falls, GPE decreases and KE increases by the same amount (if air resistance is negligible).' },\n      solar: { name: 'Solar-charged phone', steps: [['STORE', 'Nuclear store of the Sun', 'b'], ['PATHWAY', 'By electromagnetic waves (light)', 'a'], ['PATHWAY', 'Electrically (solar cell current)', 'a'], ['STORE', 'Chemical store of phone battery', 'b']], note: 'Fusion in the Sun releases energy that travels as light. The solar cell transfers some of it electrically to charge the battery.' }\n    };\n    const chains = Object.keys(chainData).map((k) => ({ name: chainData[k].name, pressed: s.chain === k ? 'true' : 'false', btnStyle: s.chain === k ? BTN_ON : BTN_OFF, pick: () => this.setState({ chain: k }) }));\n    const cur = chainData[s.chain];\n    const chainSteps = cur.steps.map((st, i) => ({ tag: st[0], text: st[1], arrow: i > 0, style: st[2] === 'b' ? BLUE : AMBER }));\n\n    // Pendulum\n    const g = 9.8, L = 2, m = s.mass, th0 = s.angle * Math.PI / 180;\n    const gam = s.air ? 0.12 : 0, w = Math.sqrt(g / L), t = s.t;\n    const th = th0 * Math.exp(-gam * t) * Math.cos(w * t);\n    const E0 = m * g * L * (1 - Math.cos(th0));\n    const Em = E0 * Math.exp(-2 * gam * t);\n    const PE = Math.min(m * g * L * (1 - Math.cos(th)), Em);\n    const KE = Math.max(0, Em - PE);\n    const TH = E0 - Em;\n    const v = Math.sqrt(2 * KE / m);\n    const bar = (x) => (E0 > 0 ? (x / E0 * 170) : 0).toFixed(1);\n    const bobX = (210 + 220 * Math.sin(th)).toFixed(1);\n    const bobY = (20 + 220 * Math.cos(th)).toFixed(1);\n    const arc = [];\n    for (let i = 0; i <= 40; i++) { const a = -th0 + 2 * th0 * i / 40; arc.push((210 + 220 * Math.sin(a)).toFixed(1) + ',' + (20 + 220 * Math.cos(a)).toFixed(1)); }\n\n    // Sankey\n    const devData = {\n      filament: { name: 'Filament lamp', eff: 10, input: 'electrical energy from the mains', use: 'light (electromagnetic waves)', waste: 'by heating → internal store of surroundings' },\n      led: { name: 'LED lamp', eff: 40, input: 'electrical energy from the mains', use: 'light (electromagnetic waves)', waste: 'by heating → internal store of surroundings' },\n      motor: { name: 'Electric motor', eff: 70, input: 'electrical energy', use: 'kinetic store of the load (mechanical work)', waste: 'heating and sound → internal store of surroundings' },\n      kettle: { name: 'Electric kettle', eff: 90, input: 'electrical energy from the mains', use: 'internal (thermal) store of the water', waste: 'heating the kettle body and air, sound' },\n      engine: { name: 'Petrol car engine', eff: 25, input: 'chemical store of fuel', use: 'kinetic store of the car', waste: 'heating exhaust gases and engine, sound' }\n    };\n    const dv = devData[s.device];\n    const devices = Object.keys(devData).map((k) => ({ name: devData[k].name, pressed: s.device === k ? 'true' : 'false', btnStyle: s.device === k ? BTN_ON : BTN_OFF, pick: () => this.setState({ device: k, eff: devData[k].eff }) }));\n    const eff = s.eff, Hu = 1.2 * eff, Hw = 120 - Hu, yT = 30 + Hu;\n    const usePts = [[200, 30], [380, 30], [380, 24], [412, 30 + Hu / 2], [380, 36 + Hu], [380, 30 + Hu], [200, 30 + Hu]].map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n    const wastePts = [[200, yT], [260 + Hw, yT], [260 + Hw, 228], [266 + Hw, 228], [260 + Hw / 2, 258], [254, 228], [260, 228], [260, 150], [200, 150]].map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n\n    // Calculators\n    const keRes = 0.5 * s.keM * s.keV * s.keV;\n    const gpRes = s.gpM * 9.8 * s.gpH;\n    const dropV = Math.sqrt(2 * 9.8 * s.gpH);\n\n    // MCQ\n    const qs = [\n      { text: 'A spring is stretched and held. In which store is the extra energy?', opts: ['Kinetic store', 'Elastic (strain) store', 'Chemical store', 'Nuclear store'], c: 1, ex: 'Stretching, squashing or bending an object stores energy in its elastic (strain) store.' },\n      { text: 'In a battery-powered torch, energy leaves the chemical store of the battery. By which pathway does it reach the lamp?', opts: ['By heating', 'Mechanically', 'Electrically', 'By sound waves'], c: 2, ex: 'The current in the circuit does work: this is an electrical transfer.' },\n      { text: 'What is the SI unit of energy?', opts: ['watt (W)', 'newton (N)', 'joule (J)', 'kilogram (kg)'], c: 2, ex: 'All energy stores and transfers are measured in joules.' },\n      { text: 'A ball is thrown straight up. Ignoring air resistance, at its highest point which store is at its maximum?', opts: ['Kinetic store', 'Gravitational potential store', 'Internal store', 'Elastic store'], c: 1, ex: 'At the top the ball is momentarily at rest (zero KE) and highest, so its GPE store is greatest.' },\n      { text: 'Calculate the kinetic energy of a 2.0 kg trolley moving at 3.0 m/s.', opts: ['3.0 J', '6.0 J', '9.0 J', '18 J'], c: 2, ex: 'Ek = ½mv² = ½ × 2.0 × 3.0² = ½ × 2.0 × 9.0 = 9.0 J.' },\n      { text: 'A 50 kg student climbs stairs, rising 4.0 m. What is her gain in GPE? (g = 9.8 N/kg)', opts: ['200 J', '196 J', '1960 J', '19 600 J'], c: 2, ex: 'ΔEp = mgΔh = 50 × 9.8 × 4.0 = 1960 J.' },\n      { text: 'The speed of a car doubles. Its kinetic energy becomes…', opts: ['the same', '2 times larger', '4 times larger', '8 times larger'], c: 2, ex: 'Ek ∝ v². Doubling v gives (2)² = 4 times the kinetic energy.' },\n      { text: 'Which statement describes the principle of conservation of energy?', opts: ['Energy is used up when devices work', 'Energy cannot be created or destroyed, only transferred', 'Wasted energy is destroyed', 'Energy is created in power stations'], c: 1, ex: 'Total energy stays constant; it only moves between stores. Even wasted energy still exists in the surroundings.' },\n      { text: 'A hot cup of tea cools in a room. How is energy transferred to the room?', opts: ['Electrically', 'Mechanically', 'By heating', 'By nuclear reactions'], c: 2, ex: 'A temperature difference causes energy to be transferred by heating from the internal store of the tea to the surroundings.' },\n      { text: 'An LED lamp is supplied with 20 J of electrical energy and gives out 8 J of light. What is its efficiency?', opts: ['8 %', '40 %', '60 %', '250 %'], c: 1, ex: 'Efficiency = useful output ÷ total input × 100% = 8 ÷ 20 × 100% = 40 %. The other 12 J is wasted by heating.' }\n    ];\n    const letters = ['A', 'B', 'C', 'D'];\n    let score = 0;\n    const questions = qs.map((q, i) => {\n      const a = s.answers[i];\n      const answered = a !== undefined;\n      if (answered && a === q.c) score++;\n      return {\n        num: i + 1, text: q.text, answered: answered,\n        verdict: answered ? (a === q.c ? 'Correct!' : 'Not quite. The answer is ' + letters[q.c] + '.') : '',\n        explain: q.ex,\n        opts: q.opts.map((o, j) => {\n          let st = 'background:#FFFFFF;border:1.5px solid #CBD5E1;color:#12212E';\n          if (answered && j === q.c) st = 'background:#E7F6EC;border:1.5px solid #15803D;color:#14532D;font-weight:600';\n          else if (answered && j === a) st = 'background:#FDECEC;border:1.5px solid #B91C1C;color:#7F1D1D';\n          return { letter: letters[j], text: o, style: st, pick: () => { if (this.state.answers[i] !== undefined) return; this.setState({ answers: Object.assign({}, this.state.answers, { [i]: j }) }); } };\n        })\n      };\n    });\n\n    const sqs = [\n      { q: 'A ball of mass 0.50 kg is dropped from a height of 20 m. Ignore air resistance. (g = 9.8 N/kg)\\n(a) Calculate the GPE lost by the ball as it falls to the ground. [2]\\n(b) Calculate the speed of the ball just before it hits the ground. [3]', a: '(a) ΔEp = mgΔh = 0.50 × 9.8 × 20 = 98 J\\n(b) KE gained = GPE lost = 98 J\\n    ½mv² = 98  →  v² = 2 × 98 ÷ 0.50 = 392\\n    v = √392 = 19.8 m/s ≈ 20 m/s' },\n      { q: 'A car of mass 1200 kg travels at 15 m/s. The driver brakes and the car stops.\\n(a) Calculate the kinetic energy of the car before braking. [2]\\n(b) State the energy store that the kinetic energy is transferred to, and the pathway. [2]', a: '(a) Ek = ½mv² = ½ × 1200 × 15² = ½ × 1200 × 225\\n    = 135 000 J (135 kJ)\\n(b) Transferred mechanically (work done by the friction force of the brakes)\\n    to the internal (thermal) store of the brakes, then by heating\\n    to the internal store of the surroundings.' },\n      { q: 'A pendulum is released and swings. After several minutes it stops. A student says “the energy has been destroyed”. Explain why the student is wrong. [3]', a: '• Energy cannot be created or destroyed (conservation of energy).\\n• Air resistance and friction at the pivot do work on the pendulum.\\n• Its energy is transferred (dissipated) to the internal (thermal) store\\n  of the air and pivot, so the surroundings become very slightly warmer.\\n• The total energy is unchanged; it is just spread out and no longer useful.' },\n      { q: 'An electric motor lifts a 2.0 kg load through a height of 1.5 m. The motor is supplied with 40 J of electrical energy. (g = 9.8 N/kg)\\n(a) Calculate the gain in GPE of the load. [2]\\n(b) Calculate the efficiency of the motor. [2]\\n(c) How much energy is wasted, and where does it go? [2]', a: '(a) ΔEp = mgΔh = 2.0 × 9.8 × 1.5 = 29.4 J\\n(b) Efficiency = 29.4 ÷ 40 × 100% = 73.5 % ≈ 74 %\\n(c) Wasted = 40 − 29.4 = 10.6 J, transferred by heating and sound\\n    to the internal store of the motor and the surroundings.' },\n      { q: 'A 0.20 kg ball rolls at 10 m/s towards the bottom of a smooth slope and rolls up it. Ignoring friction, calculate the maximum height the ball reaches. (g = 9.8 N/kg) [3]', a: 'KE at bottom = ½mv² = ½ × 0.20 × 10² = 10 J\\nAt maximum height all KE → GPE:  mgΔh = 10 J\\nΔh = 10 ÷ (0.20 × 9.8) = 5.1 m\\n(or Δh = v² ÷ 2g = 100 ÷ 19.6 = 5.1 m; the mass cancels)' }\n    ];\n    const structured = sqs.map((x, i) => {\n      const open = !!s.shown[i];\n      return { num: i + 1, q: x.q, a: x.a, open: open, btn: open ? 'Hide answer' : 'Show answer', toggle: () => this.setState({ shown: Object.assign({}, this.state.shown, { [i]: !this.state.shown[i] }) }) };\n    });\n\n    return {\n      stores, chains, chainSteps, chainNote: cur.note,\n      arcPts: arc.join(' '), bobX, bobY,\n      peH: bar(PE), keH: bar(KE), thH: bar(TH),\n      peTxt: fmt(PE, 1) + ' J', keTxt: fmt(KE, 1) + ' J', thTxt: fmt(TH, 1) + ' J', totTxt: fmt(E0, 1) + ' J',\n      hTxt: (L * (1 - Math.cos(th))).toFixed(2), vTxt: v.toFixed(2),\n      mass: s.mass, massTxt: fmt(s.mass, 1), angle: s.angle,\n      runLabel: s.running ? 'Pause' : 'Play',\n      toggleRun: () => this.setState({ running: !this.state.running }),\n      resetPend: () => this.setState({ t: 0, running: true }),\n      toggleAir: () => this.setState({ air: !this.state.air, t: 0 }),\n      airLabel: s.air ? 'Air resistance: ON' : 'Air resistance: OFF',\n      airPressed: s.air ? 'true' : 'false', airStyle: s.air ? BTN_ON : BTN_OFF,\n      onMass: (e) => this.setState({ mass: parseFloat(e.target.value), t: 0 }),\n      onAngle: (e) => this.setState({ angle: parseFloat(e.target.value), t: 0 }),\n      devices, eff, wasted: 100 - eff, usePts, wastePts,\n      devIn: dv.input, devUse: dv.use, devWaste: dv.waste,\n      onEff: (e) => this.setState({ eff: parseInt(e.target.value, 10) }),\n      keM: s.keM, keV: s.keV, keRes: fmt(keRes, 1),\n      gpM: s.gpM, gpH: s.gpH, gpRes: fmt(gpRes, 1), dropV: dropV.toFixed(1),\n      onKeM: (e) => this.setState({ keM: parseFloat(e.target.value) }),\n      onKeV: (e) => this.setState({ keV: parseFloat(e.target.value) }),\n      onGpM: (e) => this.setState({ gpM: parseFloat(e.target.value) }),\n      onGpH: (e) => this.setState({ gpH: parseFloat(e.target.value) }),\n      questions, score, qTotal: qs.length,\n      resetQuiz: () => this.setState({ answers: {} }),\n      structured\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
